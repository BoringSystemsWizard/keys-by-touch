<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клавиши вслепую</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: слева оглавление, в центре лист с заданием, под ним клавиатура MacBook, где цвет нижней кромки клавиши означает палец. */
:root{
  --bg:#e9ecf2; --surface:#f8f9fb; --fg:#1a2130; --muted:#586479; --line:#cfd5e0;
  --accent:#b86a00; --cursor:#ffb224; --ok:#14866a; --bad:#c93a55;
  --term-bg:#151b27; --term-bar:#222b3c; --term-fg:#dde4f0; --term-dim:#8391aa;
  --key-bg:#ffffff; --key-edge:#aab3c3;
  --f-pinky:#c44f8f; --f-ring:#3d7fd6; --f-mid:#17977a; --f-idx:#8a5fd8; --f-thumb:#8a94a6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121a; --surface:#161c28; --fg:#e4e9f2; --muted:#94a1b8; --line:#2a3447;
  --accent:#ffb224; --cursor:#ffb224; --ok:#3ecfa8; --bad:#ff6b85;
  --term-bg:#080b11; --term-bar:#161d2b; --term-fg:#dde4f0; --term-dim:#7a88a2;
  --key-bg:#252f42; --key-edge:#05070b;
  --f-pinky:#e77ab8; --f-ring:#6aa5f5; --f-mid:#3ecfa8; --f-idx:#b08cf5; --f-thumb:#6d7a92; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#161c28; --fg:#e4e9f2; --muted:#94a1b8; --line:#2a3447;
  --accent:#ffb224; --cursor:#ffb224; --ok:#3ecfa8; --bad:#ff6b85;
  --term-bg:#080b11; --term-bar:#161d2b; --term-fg:#dde4f0; --term-dim:#7a88a2;
  --key-bg:#252f42; --key-edge:#05070b;
  --f-pinky:#e77ab8; --f-ring:#6aa5f5; --f-mid:#3ecfa8; --f-idx:#b08cf5; --f-thumb:#6d7a92; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.meta{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.focus-note{background:var(--cursor);color:#1a1200;border:0;border-radius:6px;padding:10px 14px;font-weight:600;text-align:left;width:100%}

/* клавиши-подписи */
.combo{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;vertical-align:middle}
kbd{font-family:var(--f-mono);font-size:13px;font-weight:700;min-width:26px;height:26px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--key-bg);color:var(--fg);border:1px solid var(--key-edge);border-bottom-width:3px;border-radius:5px}

/* каркас */
.cols{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.nav{display:flex;flex-direction:column;gap:14px;font-size:14px}
.nav h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;padding:4px 8px;border-radius:5px;color:var(--fg)}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.nav .st{font-size:11px;color:var(--accent);letter-spacing:1px;flex:none;font-variant-numeric:tabular-nums}
.nav .st.none{color:var(--muted)}
.nav .lk{font-family:var(--f-mono);letter-spacing:.12em}

.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.stage h2{font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.task{margin:0;max-width:65ch}
.msg{min-height:1.5em;font-size:14px;color:var(--bad);margin:0}

/* лист с текстом */
.sheet{background:var(--term-bg);color:var(--term-dim);border-radius:10px;padding:22px 24px;font-family:var(--f-mono);font-size:20px;line-height:1.75;
  white-space:pre-wrap;overflow-wrap:anywhere;min-height:150px;box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
.sheet .d{color:var(--term-fg)}
.sheet .e{box-shadow:0 3px 0 var(--bad)}
.sheet .c{background:var(--cursor);color:#1a1200;border-radius:2px}
.sheet .c.x{background:var(--bad);color:#fff}

.hud{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:14px;color:var(--muted)}
.hud strong{color:var(--fg);font-variant-numeric:tabular-nums}
.hud .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:14px}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}

.win{border-top:2px solid var(--ok);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.win .stars{font-size:26px;color:var(--accent);letter-spacing:4px;line-height:1}
.win .stars s{color:var(--line);text-decoration:none}
.win p{margin:0}
.nums{display:flex;flex-wrap:wrap;gap:8px 32px}
.nums div{display:flex;flex-direction:column}
.nums b{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--muted)}

/* клавиатура */
.kb{display:flex;flex-direction:column;gap:4px;max-width:740px;user-select:none;-webkit-user-select:none}
.kr{display:flex;gap:4px}
.k{flex:var(--w,1) 1 0;min-width:0;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:12px;line-height:1.05;color:var(--fg);
  background:var(--key-bg);border:1px solid var(--key-edge);border-bottom:3px solid var(--fc,var(--key-edge));border-radius:5px}
.k small{font-size:9px;color:var(--muted)}
.k.gap{visibility:hidden}
.k.fp{--fc:var(--f-pinky)} .k.fr{--fc:var(--f-ring)} .k.fm{--fc:var(--f-mid)} .k.fi{--fc:var(--f-idx)} .k.ft{--fc:var(--f-thumb)}
.k.t{background:var(--cursor);color:#1a1200} .k.t small{color:#1a1200}
.k.on{background:var(--fg);color:var(--bg)} .k.on small{color:var(--bg)}
.k.bad{background:var(--bad);color:#fff} .k.bad small{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;background:var(--fc)}

/* сочетания */
.q{background:var(--term-bg);color:var(--term-fg);border-radius:10px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;min-height:200px;
  box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
.q .n{font-family:var(--f-mono);font-size:12px;color:var(--term-dim)}
.q .ask{font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.25;text-wrap:balance}
.q .fb{font-size:15px;min-height:30px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q .fb.bad{color:var(--bad)} .q .fb.new{color:var(--cursor)}
.q .seqn{font-size:13px;color:var(--term-dim);margin:0}
.q kbd{background:var(--term-bar);color:var(--term-fg);border-color:#000}
.sum{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0;font-size:14px}
.sum li{display:grid;grid-template-columns:10em minmax(0,1fr);gap:8px;align-items:center}

/* справочник */
.ref{display:flex;flex-direction:column;gap:22px;max-width:860px}
.ref input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;width:100%;max-width:360px}
.ref h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.ref table{border-collapse:collapse;width:100%;font-size:15px}
.ref td{padding:6px 12px 6px 0;border-top:1px solid var(--line);vertical-align:middle}
.ref td:first-child{width:12em}
.ref td.box{color:var(--accent);font-size:11px;letter-spacing:2px;text-align:right;white-space:nowrap;padding-right:0}
.note{font-size:14px;color:var(--muted);max-width:65ch;margin:0;padding-left:1.2em}
.note li{margin-bottom:6px}

@media (max-width:760px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;gap:20px;padding-bottom:6px}
  .nav section{flex:none;min-width:170px}
  .stage h2,.q .ask{font-size:20px}
  .sheet{font-size:16px;padding:16px}
  .kb,.kr{gap:2px} .k{height:30px;font-size:10px;border-radius:3px} .k small{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand" id="brand"></h1>
    <nav class="tabs" role="tablist">
      <button id="tab-type" role="tab" data-view="type"></button>
      <button id="tab-sc" role="tab" data-view="sc"></button>
      <button id="tab-ref" role="tab" data-view="ref"></button>
    </nav>
    <div class="meta">
      <button class="btn" id="b-sound"></button>
      <div class="seg" id="seg-lang" aria-label="Language">
        <button id="lang-ru" data-lang="ru">RU</button>
        <button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>
  <button class="focus-note" id="focus-note" hidden></button>
  <main id="view"></main>
</div>

/* ---------- US keyboard model ---------- */
const KB=[
 [['Escape','esc',null,1.3],['',null,null,13.3]],

];
const FINGER={};
const fset=(f,codes)=>codes.split(' ').forEach(c=>FINGER[c]=f);
fset('Lp','Backquote Digit1 KeyQ KeyA KeyZ Tab CapsLock ShiftLeft Escape');
fset('Lr','Digit2 KeyW KeyS KeyX');fset('Lm','Digit3 KeyE KeyD KeyC');fset('Li','Digit4 Digit5 KeyR KeyT KeyF KeyG KeyV KeyB');
fset('Ri','Digit6 Digit7 KeyY KeyU KeyH KeyJ KeyN KeyM');fset('Rm','Digit8 KeyI KeyK Comma');fset('Rr','Digit9 KeyO KeyL Period');
fset('Rp','Digit0 Minus Equal KeyP BracketLeft BracketRight Backslash Semicolon Quote Slash Enter ShiftRight Backspace');
fset('T','Space MetaLeft MetaRight AltLeft AltRight');
const CHARMAP={' ':{code:'Space',shift:false},'\n':{code:'Enter',shift:false}};
KB.flat().forEach(([code,base,sh])=>{
  if(!code||!base||base.length!==1||/[^\x21-\x7e]/.test(base))return;
  CHARMAP[base]={code,shift:false};
  if(/[a-z]/.test(base))CHARMAP[base.toUpperCase()]={code,shift:true};
  else if(sh)CHARMAP[sh]={code,shift:true};
});
const shiftFor=code=>(FINGER[code]||'R')[0]==='L'?'ShiftRight':'ShiftLeft';

/* ---------- typing lessons ---------- */
const LESSONS=[
 {id:'k1',g:0,k:'fjdk'},{id:'k2',g:0,k:'asl;'},{id:'k3',g:0,k:'gh'},{id:'k4',g:0,k:'ei'},{id:'k5',g:0,k:'ru'},{id:'k6',g:0,k:'ty'},
 {id:'k7',g:0,k:'op'},{id:'k8',g:0,k:'wq'},{id:'k9',g:0,k:'nm'},{id:'k10',g:0,k:'vb'},{id:'k11',g:0,k:'cxz'},{id:'k12',g:0,k:',./'},
 {id:'caps',g:1},{id:'punct',g:1},{id:'digits',g:1},{id:'sym1',g:1},{id:'sym2',g:1},
 {id:'words',g:2},{id:'sent',g:2},{id:'nums',g:2},{id:'code',g:2},{id:'weak',g:2},
];
const LEN=140;
const rnd=a=>a[Math.random()*a.length|0];
const many=(n,f)=>{const o=[];let last;for(let i=0;i<n*4&&o.length<n;i++){const x=f();if(x&&x!==last){o.push(x);last=x}}return o};
const SAFE_WORDS=['as','ask','sad','dad','lad','fall','all','add','flask','salad','the','and','for','you','that','with','have','this','from','they','time','make','like','just','know','take','good','work','first','after','back','think','over','also','people','because','through','little','great','where','right','should','around','small','place','number','again','world','still','every','found','under','never','house','point','water','always','between','letter','answer','question','quick','zero','exact','jump','very','move','black','voice','give','live','above','box','next','size','lazy'];
function wordPool(){return CORPUS.words&&CORPUS.words.length>50?CORPUS.words:SAFE_WORDS}
function genKeys(i){
  const neu=[...LESSONS[i].k],known=new Set(LESSONS.slice(0,i+1).flatMap(l=>[...(l.k||'')]));
  const letters=[...known].filter(c=>/[a-z]/.test(c)),neuL=neu.filter(c=>/[a-z]/.test(c)),neuP=neu.filter(c=>!/[a-z]/.test(c));
  const ws=wordPool().filter(w=>[...w].every(c=>known.has(c))),wsNew=ws.filter(w=>neuL.some(c=>w.includes(c)));
  const pseudo=()=>{let n=2+(Math.random()*3|0),s='';for(let j=0;j<n;j++)s+=neuL.length&&Math.random()<.55?rnd(neuL):rnd(letters);return s};
  const out=neuL.map(c=>c+c+c);
  if(neuL.length>1)out.push(neuL.join(''),neuL.slice().reverse().join(''));
  let len=out.join(' ').length,last='';
  for(let guard=0;len<LEN&&guard<400;guard++){
    const r=Math.random();let w=wsNew.length>=8&&r<.6?rnd(wsNew):ws.length>=15&&(r<.85||!neuL.length)?rnd(ws):pseudo();
    if(neuP.length&&Math.random()<(neuL.length?.3:.6)){const p=rnd(neuP);w=p==='/'?w+'/'+(ws.length?rnd(ws):pseudo()):w+p}
    if(w===last)continue;last=w;out.push(w);len+=w.length+1;
  }
  return out.join(' ');
}
const CONTR=["don't","it's","can't","I'm","we're","you'll","that's","isn't","they've","won't","she's","let's"];
const num=()=>String(Math.random()*10**(1+(Math.random()*4|0))|0);
const GEN={
  caps:()=>many(22,()=>{const w=rnd(wordPool()),r=Math.random();return r<.6?w[0].toUpperCase()+w.slice(1):r<.75&&w.length<=4?w.toUpperCase():w}).join(' '),
  punct:()=>many(22,()=>{const w=rnd(wordPool()),r=Math.random();
    return r<.2?rnd(CONTR):r<.32?w+'?':r<.44?w+'!':r<.54?w+':':r<.64?w+';':r<.76?'"'+w+'"':r<.86?w+'-'+rnd(wordPool()):w+','}).join(' '),
  digits:()=>many(20,()=>{const r=Math.random();return r<.4?num():r<.55?num()+'.'+(Math.random()*100|0):r<.7?rnd(wordPool())+' '+num():rnd(wordPool())}).join(' '),
  sym1:()=>many(20,()=>{const w=rnd(wordPool()),v=rnd(wordPool()),r=Math.random()*10|0;
    return [w+'!','#'+w,'$'+num(),num()+'%','('+w+')',w+'@'+v,w+' & '+v,num()+'*'+num(),w+'^2',w][r]}).join(' '),
  sym2:()=>many(20,()=>{const w=rnd(wordPool()),v=rnd(wordPool()),r=Math.random()*12|0;
    return [w+'-'+v,w+'='+num(),'['+num()+']','{'+w+'}',w+'_'+v,num()+'+'+num(),w+'|'+v,'~/'+w,'<'+w+'>','`'+w+'`',w+'\\'+v,w][r]}).join(' '),
  words:()=>many(30,()=>rnd(wordPool())).join(' '),
  sent:()=>CORPUS.sentences.length?many(3,()=>rnd(CORPUS.sentences)).join(' '):GEN.caps(),
  nums:()=>CORPUS.numbers.length?many(4,()=>rnd(CORPUS.numbers)).join('\n'):GEN.digits(),
  code:()=>CORPUS.code.length?many(4,()=>rnd(CORPUS.code)).join('\n'):GEN.sym2(),
};
function weakCodes(keys){
  return Object.entries(keys||{}).filter(([c,s])=>s.h+s.m>=8&&s.m>0&&c!=='Space'&&c!=='Enter')
    .sort((a,b)=>b[1].m/(b[1].h+b[1].m)-a[1].m/(a[1].h+a[1].m)).slice(0,5).map(x=>x[0]);
}
function genWeak(keys){
  const codes=weakCodes(keys);if(!codes.length)return GEN.words();
  const chars=Object.keys(CHARMAP).filter(ch=>codes.includes(CHARMAP[ch].code)&&ch!==' '&&ch!=='\n');
  return many(26,()=>{const c=rnd(chars);
    if(/[a-z]/.test(c)){const p=wordPool().filter(w=>w.includes(c));return p.length?rnd(p):c+c}
    if(/[A-Z]/.test(c)){const p=wordPool().filter(w=>w[0]===c.toLowerCase());return p.length?c+rnd(p).slice(1):c}
    if(/\d/.test(c))return c+num();
    return rnd(wordPool())+c}).join(' ');
}
function buildText(i,keys){const l=LESSONS[i];return l.k?genKeys(i):l.id==='weak'?genWeak(keys):GEN[l.id]()}

/* ---------- shortcuts ---------- */
const CATS=['basics','text-move','text-select','text-edit','apps','desktop','screenshots','finder','power'];
const MODS=['Fn','Ctrl','Opt','Shift','Cmd'];

function sig(keys){
  let k=keys.slice();const m=k[k.length-1];
  if(k.includes('Fn')&&FNMAP[m]){k=k.filter(x=>x!=='Fn');k[k.length-1]=FNMAP[m]}
  return k.sort().join('+');
}
/* сочетания, которые браузер или система забирают раньше страницы: их вводят по одной клавише */
const RESERVED=['Cmd+Q','Cmd+W','Cmd+T','Cmd+N','Cmd+H','Cmd+M','Cmd+Tab','Cmd+`','Cmd+Space','Cmd+,',

SHORTCUTS.forEach(s=>{

let actx=null,noiseBuf=null;
function au(){
  if(!save.sound)return null;
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}
}
function tone(f,dur,type,vol,when,f2){
  const a=au();if(!a)return;
  const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function click(freq,vol){
  const a=au();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.04|0,a.sampleRate);const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq*(.92+Math.random()*.16);f.Q.value=1.2;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}

  done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,.12+i*.09)),

let ti=Math.max(0,LESSONS.findIndex(l=>!save.ty[l.id])),run,tmsg='',badCode=null,badTimer=0;
const lname=l=>l.k?[...l.k.toUpperCase()].join(' '):L.names[l.id];
function startLesson(i){
  ti=i;run={text:[...buildText(i,save.keys)],pos:0,errs:new Set(),t0:0,t1:0,done:false,miss:{},wrong:false};tmsg='';badCode=null;
}
function typeKey(e){
  if(e.metaKey||e.ctrlKey)return false;
  if(e.key==='Escape'){startLesson(ti);drawType();return true}
  if(run.done){if(e.key==='Enter'){startLesson(Math.min(ti+1,LESSONS.length-1));drawType()}return e.key==='Enter'||e.key===' '}
  const k=e.key==='Enter'?'\n':e.key;
  if(k.length!==1)return e.key==='Backspace';
  const want=run.text[run.pos],wc=CHARMAP[want];tmsg='';
  if(!run.t0)run.t0=performance.now();
  if(k===want){
    if(wc){const s=save.keys[wc.code]||(save.keys[wc.code]={h:0,m:0});s.h++}
    run.pos++;run.wrong=false;snd(want===' '?'space':'key');
    if(run.pos>=run.text.length)finish();
  }else{
    run.wrong=true;snd('err');
    if(!run.errs.has(run.pos)){run.errs.add(run.pos);
      if(wc){const s=save.keys[wc.code]||(save.keys[wc.code]={h:0,m:0});s.m++;run.miss[wc.code]=(run.miss[wc.code]||0)+1}}
    if(/[^\x00-\x7f]/.test(k))tmsg=L.layout;
    badCode=e.code;clearTimeout(badTimer);badTimer=setTimeout(()=>{badCode=null;if(view==='type')drawRun()},350);
  }
  drawRun();return true;
}
function calc(){
  const n=run.pos,ms=(run.done?run.t1:performance.now())-run.t0,min=ms/60000;
  return{wpm:run.t0&&ms>1500?Math.round(n/5/min):0,acc:n?Math.round(100*(n-[...run.errs].filter(p=>p<n||run.done).length)/n):100};
}
const starsFor=acc=>acc>=98?3:acc>=94?2:1;
function finish(){
  run.done=true;run.t1=performance.now();snd('done');const l=LESSONS[ti],r=calc(),s=starsFor(r.acc),b=save.ty[l.id]||{stars:0,wpm:0};
  save.ty[l.id]={stars:Math.max(b.stars,s),wpm:Math.max(b.wpm,r.wpm)};persist();
  drawType();
}
function drawType(){
  if(!run)startLesson(ti);

  const cur=$('.nav button[aria-current="true"]');if(cur&&window.innerWidth<=760)cur.scrollIntoView({block:'nearest',inline:'center'});

function drawRun(){
  if(!$('#sheet'))return;

    const cls=i<run.pos?(run.errs.has(i)?'d e':'d'):i===run.pos&&!run.done?(run.wrong?'c x':'c'):'';
    const ch=c==='\n'?'↩\n':esc(c);

    <span class="sp"><button class="btn" id="b-hints">${save.hints?L.hintsOn:L.hintsOff}</button><button class="btn" id="b-restart">${L.restart}</button></span>`;

    const s=starsFor(r.acc),worst=Object.entries(run.miss).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const lab=c=>{const k=KB.flat().find(x=>x[0]===c);return c==='Space'?L.space:k?(/^Key/.test(c)?k[1].toUpperCase():k[1]):c};
    $('#win').innerHTML=`<div class="win"><div class="stars">${'★'.repeat(s)}<s>${'★'.repeat(3-s)}</s></div>
      <div class="nums"><div><b>${r.wpm}</b><span>${L.wpm}</span></div><div><b>${r.acc}%</b><span>${L.acc}</span></div><div><b>${run.errs.size}</b><span>${L.errs}</span></div></div>
      <p>${L['r'+s]}</p>
      ${worst.length?`<p>${L.worst} ${worst.map(([c])=>`<span class="combo"><kbd>${esc(lab(c))}</kbd></span>`).join(' ')}</p>`:''}
      <div><button class="btn pri" id="b-next">${L.next}</button></div></div>`;
    $('#b-next').onclick=()=>{startLesson(Math.min(ti+1,LESSONS.length-1));drawType()};

  scCat=cat;
  const items=SHORTCUTS.filter(s=>s.cat===cat).map((s,i)=>({s,i})).sort((a,b)=>(stR(a.s).box-stR(b.s).box)||(a.i-b.i)).slice(0,SESSION).map(x=>x.s);
  beginSession(items.map(s=>({s,intro:!stR(s).seen})),cat);
}
function startReview(){
  const pool=SHORTCUTS.filter(s=>stR(s).seen);
  if(pool.length<1){sc={empty:true,cat:'review'};scCat='review';drawSc();return}
  const pick=[],p=pool.slice();
  while(pick.length<REVIEW&&p.length){
    const w=p.map(s=>4-stR(s).box);let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    for(;i<p.length-1;i++){r-=w[i];if(r<=0)break}
    pick.push(p.splice(i,1)[0]);
  }
  scCat='review';beginSession(pick.map(s=>({s,intro:false})),'review');
}
function beginSession(queue,cat){
  sc={cat,queue,cur:null,miss:false,fb:null,ok:0,total:queue.filter(q=>!q.intro).length,missed:[],n:0,done:false};
  nextItem();
}
function nextItem(){
  acc.clear();held=[];
  if(!sc.queue.length){sc.done=true;sc.cur=null;snd('done');persist();drawSc();return}
  sc.cur=sc.queue.shift();sc.miss=false;sc.fb=null;sc.n++;drawSc();
}
function judge(pressed){
  const it=sc.cur,s=it.s,rec=st(s);
  acc.clear();clearTimeout(accTimer);
  if(sig(pressed)===s.sig){
    snd('ok');
    if(it.intro){rec.seen=true;sc.total++;sc.queue.splice(Math.min(3,sc.queue.length),0,{s,intro:false})}
    else if(sc.miss){rec.box=0;sc.queue.splice(Math.min(3,sc.queue.length),0,{s,intro:false,retry:true})}
    else if(it.retry){rec.box=Math.max(rec.box,1)}
    else{rec.box=Math.min(3,rec.box+1);sc.ok++}
    persist();nextItem();
  }else{
    if(!it.intro&&!sc.miss&&!it.retry)sc.missed.push(s);
    snd('err');sc.miss=true;sc.fb={pressed,other:SHORTCUTS.find(x=>x.sig===sig(pressed)&&x.cat===s.cat)||SHORTCUTS.find(x=>x.sig===sig(pressed))};drawSc();
  }
}
function scKey(e){
  if(!sc||sc.done||sc.empty||!sc.cur){
    if(e.key==='Enter'&&!e.metaKey){scCat==='review'?startReview():startCat(scCat);return true}
    return false;
  }
  if(e.repeat)return true;
  const s=sc.cur.s,mod=MODK[e.key],key=mod?null:evKey(e);
  if(s.seq){
    if(mod)acc.add(mod);else if(key){evMods(e).forEach(m=>acc.add(m));acc.add(key)}else return true;
    clearTimeout(accTimer);accTimer=setTimeout(()=>{acc.clear();if(view==='sc')drawSc()},4000);
    if(acc.size>=s.keys.length)judge([...acc]);else{snd('key');sc.fb=null;drawSc()}
    return true;
  }
  if(mod){snd('key');held=evMods(e);if(!held.includes(mod))held.push(mod);paintKb();return true}
  if(!key)return true;
  judge([...evMods(e),key]);
  return true;
}
function scUp(e){if(sc&&sc.cur&&!sc.cur.s.seq&&MODK[e.key]){held=evMods(e);paintKb()}}
function paintKb(){
  if(!sc||!sc.cur){setKb({});return}
  const s=sc.cur.s,show=sc.cur.intro||sc.miss;
  setKb({t:show?codesOf(s.keys):[],on:codesOf(s.seq?[...acc]:held)});
}
function catProg(c){const a=SHORTCUTS.filter(s=>s.cat===c);return [a.filter(s=>stR(s).box>=2).length,a.length]}
function drawSc(){
  const nav=`<section><h3>${L.session}</h3><ul><li><button data-cat="review" aria-current="${scCat==='review'}"><span>${L.review}</span></button></li></ul></section>
    <section><h3>${L.sections}</h3><ul>${CATS.filter(c=>SHORTCUTS.some(s=>s.cat===c)).map(c=>{const [a,b]=catProg(c);
      return `<li><button data-cat="${c}" aria-current="${scCat===c}"><span>${L.cats[c]}</span><span class="st ${a?'':'none'}">${a}/${b}</span></button></li>`}).join('')}</ul></section>`;
  let h;
  const title=scCat==='review'?L.review:L.cats[scCat];
  if(!sc){
    h=`<div class="q"><div class="n">${esc(title)}</div><div class="ask">${L.scIntro}</div></div><div><button class="btn pri" id="b-go">${L.startCat}</button></div>`;
  }else if(sc.empty){
    h=`<div class="q"><div class="n">${L.review}</div><div class="ask">${L.needSeen}</div></div>`;
  }else if(sc.done){
    h=`<div class="q"><div class="n">${esc(title)} · ${L.sOver}</div><div class="ask">${L.sScore(sc.ok,sc.total)}</div><div class="fb">${sc.missed.length?'':L.sAllGood}</div></div>
      ${sc.missed.length?`<div><p class="eyebrow">${L.sMissed}</p><ul class="sum">${sc.missed.map(s=>`<li>${comboHtml(s.keys)}<span>${esc(sx(s))}</span></li>`).join('')}</ul></div>`:''}
      <div><button class="btn pri" id="b-go">${L.sAgain}</button></div>`;
  }else{
    const it=sc.cur,s=it.s,f=sc.fb;
    const fb=it.intro&&!f?`<div class="fb new">${L.newOne} ${comboHtml(s.keys)}</div>`
      :f?`<div class="fb bad">${comboHtml(f.pressed)}${f.other?L.isThis(esc(sx(f.other))):L.wrong} ${L.need} ${comboHtml(s.keys)}</div>`
      :`<div class="fb">${s.seq&&acc.size?comboHtml([...acc]):''}</div>`;
    h=`<div class="q"><div class="n">${esc(L.cats[s.cat])} · ${sc.n} / ${sc.n+sc.queue.length}</div><div class="ask">${esc(sx(s))}</div>${fb}
      ${s.seq?`<p class="seqn">${L.seq}</p>`:''}</div>`;
  }
  $('#view').innerHTML=`<div class="cols"><nav class="nav">${nav}</nav><section class="stage">${h}${kbHtml()}</section></div>`;
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{b.dataset.cat==='review'?startReview():startCat(b.dataset.cat);b.blur()}));
  if($('#b-go'))$('#b-go').onclick=()=>scCat==='review'?startReview():startCat(scCat);
  const cur=$('.nav button[aria-current="true"]');if(cur&&window.innerWidth<=760)cur.scrollIntoView({block:'nearest',inline:'center'});
  paintKb();
}

/* ================= reference ================= */
let refQ='';
function refTables(){
  const q=refQ.trim().toLowerCase();
  const hit=s=>!q||s.ru.toLowerCase().includes(q)||s.en.toLowerCase().includes(q)||s.keys.join(' ').toLowerCase().includes(q);
  return CATS.map(c=>{const rows=SHORTCUTS.filter(s=>s.cat===c&&hit(s));if(!rows.length)return '';
    return `<section><h3>${L.cats[c]}</h3><div style="overflow-x:auto"><table>${rows.map(s=>{const b=stR(s).box;
      return `<tr><td>${comboHtml(s.keys)}</td><td>${esc(sx(s))}</td><td class="box" title="${L.learned}">${'●'.repeat(b)}${'○'.repeat(3-b)}</td></tr>`}).join('')}</table></div></section>`}).join('');
}
function drawRef(){
  $('#view').innerHTML=`<div class="ref"><input id="ref-q" type="search" placeholder="${L.filter}" aria-label="${L.filter}" value="${esc(refQ)}">
    <div id="ref-t" class="ref">${refTables()}</div>
    <section><h3>${L.notesH}</h3><ul class="note">${L.notes.map(n=>`<li>${n}</li>`).join('')}</ul></section></div>`;
  $('#ref-q').addEventListener('input',e=>{refQ=e.target.value;$('#ref-t').innerHTML=refTables()});
}

setView('type');focusNote();
})();
</script>
